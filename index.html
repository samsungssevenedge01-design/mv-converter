<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arin MV Studio</title>
<style>
  :root {
    --primary: #ff4d8d;
    --secondary: #ff75a6;
    --bg-color: #0f0c29;
    --glass-bg: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
  }
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body {
    margin: 0; padding: 20px 15px; color: #fff; min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    background-attachment: fixed;
  }
  h1 {
    text-align: center; font-size: 26px; margin-bottom: 25px;
    background: linear-gradient(90deg, var(--primary), #fff);
    -webkit-background-clip: text; color: transparent; font-weight: 800;
  }
  .card {
    max-width: 500px; margin: 15px auto; padding: 20px; border-radius: 20px;
    background: var(--glass-bg); backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border); box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  h3 { margin: 0 0 12px; font-size: 14px; color: var(--primary); letter-spacing: 1.5px; text-transform: uppercase; }
  label { display: block; font-size: 12px; opacity: 0.85; margin: 10px 0 5px; }
  input, select {
    width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border);
    background: rgba(0, 0, 0, 0.2); color: #fff; font-size: 14px; outline: none; transition: 0.3s;
  }
  input:focus, select:focus { border-color: var(--primary); background: rgba(255, 255, 255, 0.1); }
  button {
    padding: 12px; border: none; border-radius: 12px; color: #fff; font-weight: 700;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(255, 77, 141, 0.4);
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 77, 141, 0.6); }
  button:active { transform: scale(0.96); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  canvas { image-rendering: pixelated; background: #000; border: 2px solid var(--glass-border); border-radius: 12px; display: block; width: 100%; max-width: 384px; margin: 10px auto; aspect-ratio: 2/1; }
  #log { background: rgba(0,0,0,0.5); border-radius: 12px; padding: 12px; font: 11px monospace; max-height: 150px; overflow: auto; color: #a8e6a8; margin-top: 10px; white-space: pre-wrap; }
  progress { width: 100%; height: 10px; border-radius: 5px; overflow: hidden; appearance: none; margin-top: 10px; }
  progress::-webkit-progress-bar { background: rgba(255,255,255,0.1); }
  progress::-webkit-progress-value { background: linear-gradient(90deg, var(--primary), var(--secondary)); }
  .status-bar { display: flex; align-items: center; justify-content: space-between; font-size: 12px; margin-top: 10px; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff4d4d; margin-right: 8px; box-shadow: 0 0 8px #ff4d4d; }
  .dot.online { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .btn-group button { flex: 1; min-width: 30%; background: rgba(255,255,255,0.1); box-shadow: none; }
  .btn-group button.active { background: linear-gradient(135deg, var(--primary), var(--secondary)); }
  #v { display: none; }
</style>
</head>
<body>

<h1>✨ Arin MV Studio</h1>

<div class="card">
  <h3>1. Pemilihan Video</h3>
  <input type="file" id="vf" accept="video/*">
  <canvas id="pv" width="128" height="64"></canvas>
  <div class="grid-2">
    <button onclick="prev()">Pratinjau</button>
    <button onclick="playAnim()">Putar Hasil</button>
  </div>
  <video id="v" playsinline muted preload="auto"></video>
</div>

<div class="card">
  <h3>2. Pengaturan Visual</h3>
  <div class="grid-2">
    <div>
      <label>Mulai (detik)</label>
      <input type="number" id="st" value="0" min="0" step="0.1">
    </div>
    <div>
      <label>Durasi (detik)</label>
      <input type="number" id="du" value="30" min="1">
    </div>
  </div>
  <div class="grid-2">
    <div>
      <label>FPS (Saran: 10-15)</label>
      <input type="number" id="fps" value="12" min="5" max="20">
    </div>
    <div>
      <label>Threshold</label>
      <input type="number" id="th" value="128" min="0" max="255">
    </div>
  </div>
  <label>Metode Dithering</label>
  <select id="dm">
    <option value="bayer">Bayer (Sangat Stabil)</option>
    <option value="fs">Floyd-Steinberg (Detail)</option>
  </select>
</div>

<div class="card">
  <h3>3. Konversi & Upload Cloud</h3>
  <label>Nama MV</label>
  <input id="nm" value="mv1" maxlength="30">
  <input type="hidden" id="db" value="https://hadiah-esp32-default-rtdb.asia-southeast1.firebasedatabase.app">
  <div class="grid-2" style="margin-top: 15px;">
    <button id="bc" onclick="conv()">Konversi</button>
    <button id="bu" onclick="up()">Upload ke ESP32</button>
  </div>
  <progress id="pg" value="0" max="100"></progress>
  <div id="log">Sistem siap...</div>
</div>

<div class="card">
  <h3>4. Kontrol OLED ESP32</h3>
  <div class="status-bar">
    <div style="display: flex; align-items: center;">
      <div class="dot" id="dot"></div>
      <span id="ds">Menghubungkan...</span>
    </div>
  </div>
  <label style="margin-top: 15px;">Animasi Siaga (Idle)</label>
  <div class="btn-group" id="ib">
    <button onclick="setIdle('idle0')">Wajah</button>
    <button onclick="setIdle('idle1')">Tidur</button>
    <button onclick="setIdle('idle2')">Hati</button>
  </div>
  <label style="margin-top: 15px;">Kirim Pesan Layar</label>
  <input id="pi" maxlength="80" placeholder="Ketik pesan spesial untuk Arin...">
  <div class="grid-2" style="margin-top: 10px;">
    <button onclick="kirim($('pi').value)">Kirim Pesan</button>
    <button onclick="kirim('')" style="background: rgba(255,255,255,0.1);">Hapus</button>
  </div>
</div>

<script>
const $ = i => document.getElementById(i);
const V = $('v');
let frames = [], anim = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function log(m) { const e = $('log'); e.textContent = `[${new Date().toLocaleTimeString()}] ${m}\n` + e.textContent; }
const er = e => log('X ' + (e.message || e));
const DB = () => $('db').value.replace(/\/+$/, '');

async function api(m, p, b, q) {
  const r = await fetch(DB() + p + '.json' + (q || ''), { method: m, body: b === undefined ? undefined : JSON.stringify(b) });
  if (!r.ok) throw new Error(m + ' ' + p + ' HTTP ' + r.status); return r.json();
}

async function retry(f) {
  for (let i = 0; i < 3; i++) {
    try { return await f(); } catch (e) { if (i == 2) throw e; await sleep(800); }
  }
}

$('vf').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  V.src = URL.createObjectURL(f);
  V.onloadedmetadata = () => {
    $('du').value = Math.min(30, Math.floor(V.duration));
    log(`Video siap: ${V.videoWidth}x${V.videoHeight} (${V.duration.toFixed(1)}s)`);
  };
};

function seek(t) {
  return new Promise((res, rej) => {
    t = Math.max(0, Math.min(t, V.duration - 0.05));
    if (Math.abs(V.currentTime - t) < 0.001) { res(); return; }
    const to = setTimeout(() => { V.onseeked = null; rej(new Error('timeout')); }, 5000);
    V.onseeked = () => { clearTimeout(to); V.onseeked = null; setTimeout(res, 20); };
    V.currentTime = t;
  });
}

function grab() {
  const W = 128, H = 64;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
  const vw = V.videoWidth, vh = V.videoHeight;
  const s = Math.min(W / vw, H / vh);
  x.drawImage(V, 0, 0, vw, vh, (W - vw * s) / 2, (H - vh * s) / 2, vw * s, vh * s);
  return x.getImageData(0, 0, W, H);
}

const BY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
function process(img) {
  const d = img.data, n = 8192;
  const g = new Float32Array(n);
  for (let i = 0; i < n; i++) g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
  const thr = +$('th').value, md =$('dm').value, o = new Uint8Array(n);
  
  if (md === 'fs') {
    const e = Float32Array.from(g);
    for (let y = 0; y < 64; y++) for (let x = 0; x < 128; x++) {
      let i = y * 128 + x, old = e[i], on = old >= thr ? 1 : 0, er2 = old - (on ? 255 : 0);
      o[i] = on;
      if (x < 127) e[i + 1] += er2 * 7 / 16;
      if (y < 63) {
        if (x > 0) e[i + 127] += er2 * 3 / 16;
        e[i + 128] += er2 * 5 / 16;
        if (x < 127) e[i + 129] += er2 / 16;
      }
    }
  } else {
    for (let y = 0; y < 64; y++) for (let x = 0; x < 128; x++) {
      let i = y * 128 + x;
      o[i] = g[i] >= BY[(y & 3) * 4 + (x & 3)] * 16 + 8 + (thr - 128) ? 1 : 0;
    }
  }
  return o;
}

const frameAt = async t => { await seek(t); return process(grab()); };

function draw(bin, cv) {
  const x = cv.getContext('2d'), im = x.createImageData(128, 64);
  for (let i = 0; i < 8192; i++) {
    const v = bin[i] ? 255 : 0;
    im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255;
  }
  x.putImageData(im, 0, 0);
}

function pack(bin) {
  const b = new Uint8Array(1024);
  for (let p = 0; p < 8; p++) for (let x = 0; x < 128; x++) {
    let by = 0;
    for (let k = 0; k < 8; k++) if (bin[(p * 8 + k) * 128 + x]) by |= 1 << k;
    b[p * 128 + x] = by;
  }
  return b;
}

function b64(a) {
  let s = ''; for (let i = 0; i < a.length; i += 8192) s += String.fromCharCode.apply(null, a.subarray(i, i + 8192));
  return btoa(s);
}

async function prev() {
  if (!V.duration) return log('Pilih video!');
  clearInterval(anim);
  try { draw(await frameAt(+$('st').value),$('pv')); } catch (e) { er(e); }
}

function playAnim() {
  clearInterval(anim); if (!frames.length) return log('Konversi dulu!');
  let i = 0; anim = setInterval(() => { draw(frames[i], $('pv')); i = (i + 1) \% frames.length; }, 1000 / +$('fps').value);
}

async function conv() {
  if (!V.duration) return log('Pilih video!');
  const st = +$('st').value, du = +$('du').value, fp = +$('fps').value;
  const n = Math.min(Math.floor(du * fp), 3600);
  if (n < 1) return;
  clearInterval(anim); $('bc').disabled =$('bu').disabled = true; frames = [];
  log(`Mengkonversi ${n} frame...`);
  
  for (let i = 0; i < n; i++) {
    const t = st + i / fp; if (t >= V.duration) break;
    try { frames.push(await frameAt(t)); } catch (e) { frames.push(frames[frames.length - 1] || new Uint8Array(8192)); }
    if (i % 5 === 0) $('pg').value = (i + 1) / n * 100;
  }
  log('Konversi selesai.');
  $('bc').disabled =$('bu').disabled = false; playAnim();
}

async function up() {
  if (!frames.length) return log('Belum ada frame!');
  const nm = $('nm').value.trim() || 'mv1', fp = +$('fps').value, cs = 30, tc = Math.ceil(frames.length / cs);$('bu').disabled = true;
  try {
    const B = frames.map(f => b64(pack(f)));
    await api('DELETE', '/mv/' + nm);
    for (let c = 0; c < tc; c++) {
      await retry(() => api('PUT', `/mv/${nm}/chunk${String(c).padStart(3, '0')}`, B.slice(c * cs, (c + 1) * cs).join('|')));
      $('pg').value = (c + 1) / tc * 100;
    }
    await api('PUT', `/mv/${nm}/info`, { nama: nm, fps: fp, totalFrame: frames.length, totalChunk: tc, chunkSize: cs, lebar: 128, tinggi: 64, durasiFrameMs: Math.round(1000 / fp) });
    log(`Upload sukses: ${nm}`);
  } catch (e) { er(e); }
  $('bu').disabled = false;
}

const setIdle = m => api('PATCH', '/kontrol', { tampil: 'idle', idle: m }).then(() => log('Idle: ' + m)).catch(er);
const kirim = t => { api('PATCH', '/kontrol', { pesan: t || null }).then(() => log(t ? 'Pesan terkirim' : 'Pesan dihapus')).catch(er); };

async function poll() {
  try {
    const s = await api('GET', '/status');
    const on = s && s.ts && (Date.now() - s.ts < 25000);
    $('dot').className = 'dot ' + (on ? 'online' : '');
    $('ds').textContent = on ? 'ESP32 Online' : 'ESP32 Offline';
  } catch (e) {
    $('dot').className = 'dot';$('ds').textContent = 'Terputus dari Database';
  }
}
setInterval(poll, 3000); poll();
</script>
</body>
</html>
