<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arin MV Studio</title><style>
:root{--a:#ff4d8d;--b:#7c5cff}
*{box-sizing:border-box}
body{margin:0;padding:12px 12px 40px;font:14px system-ui,sans-serif;background:radial-gradient(circle at 20% 0,#2a1245,#0d0d1f 60%) fixed;color:#fff;min-height:100vh}
h1{text-align:center;font-size:21px;margin:8px 0;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.c{max-width:540px;margin:10px auto;padding:14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
h3{margin:0 0 8px;font-size:12px;color:var(--a);letter-spacing:1px;text-transform:uppercase}
label{display:block;font-size:12px;opacity:.8;margin:8px 0 3px}
input,select{width:100%;padding:9px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:#fff;font-size:14px}
button{padding:11px;border:0;border-radius:10px;color:#fff;font-weight:600;background:linear-gradient(135deg,var(--a),var(--b));margin:3px 0}
button:active{transform:scale(.95)}button:disabled{opacity:.4}
.r{display:flex;gap:6px;flex-wrap:wrap}.r>*{flex:1;min-width:90px}
.sl{display:flex;align-items:center;gap:8px;margin:4px 0}.sl label{flex:0 0 70px;margin:0}.sl input{padding:0}.sl b{flex:0 0 36px;text-align:right;color:var(--a);font-size:12px}
canvas{image-rendering:pixelated;background:#000;border:2px solid var(--a);border-radius:8px}
#pv{width:100%;max-width:384px;aspect-ratio:2/1;display:block;margin:8px auto}
#tl{width:100%;height:44px;image-rendering:auto;margin-top:6px}
#log{background:rgba(0,0,0,.4);border-radius:8px;padding:8px;font:11px monospace;max-height:130px;overflow:auto;color:#a8e6a8;white-space:pre-wrap;margin-top:6px}
progress{width:100%;height:8px}
.mv{display:flex;gap:8px;align-items:center;background:rgba(0,0,0,.3);padding:8px;border-radius:10px;margin:6px 0}
.mv.on{outline:2px solid var(--a)}.mv canvas{width:80px;height:40px;border:1px solid #444;flex:none}
.mv div{flex:1;min-width:0;font-size:12px}.mv button{flex:none;padding:6px 10px;font-size:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#b23b3b;margin-right:6px}.dot.ok{background:#2ecc71}
.sel{outline:2px solid #fff}
.hint{font-size:11px;opacity:.7;margin-top:4px}
#v{position:fixed;left:-9999px;width:64px}
</style></head><body>
<h1>💖 Arin MV Studio</h1>

<div class="c"><h3>1 · Video</h3>
<input type="file" id="vf" accept="video/*">
<div id="vi" class="hint"></div>
<canvas id="pv" width="128" height="64"></canvas>
<div class="r"><button onclick="prev()">👁 Preview frame</button><button onclick="playAnim()">▶ Putar hasil</button></div>
<video id="v" playsinline muted preload="auto"></video></div>

<div class="c"><h3>2 · Studio pintar</h3>
<div class="r"><div><label>Mulai (detik)</label><input type="number" id="st" value="0" min="0" step="0.1"></div>
<div><label>Durasi klip</label><input type="number" id="du" value="30" min="1"></div>
<div><label>FPS (5–20)</label><input type="number" id="fps" value="12" min="5" max="20"></div></div>
<button style="width:100%" onclick="analyze()" id="ba">🔍 Analisis &amp; pilih adegan terbaik</button>
<canvas id="tl" width="300" height="44"></canvas>
<div id="ai" class="hint">Tekan analisis: website memindai gerakan, detail, dan kontras seluruh video, lalu mengisi "Mulai" dengan adegan paling menarik.</div></div>

<div class="c"><h3>3 · Enhancement</h3>
<div class="r"><div><label>Crop</label><select id="cm"><option value="fill">Fill (zoom &amp; fokus)</option><option value="fit">Fit (letterbox)</option><option value="stretch">Stretch</option></select></div>
<div><label>Metode titik</label><select id="dm"><option value="bayer">Bayer (stabil, disarankan)</option><option value="fs">Floyd-Steinberg</option><option value="th">Threshold</option></select></div></div>
<div id="sls"></div>
<div class="r"><div><label>Threshold</label><input type="number" id="th" value="128" min="0" max="255"></div>
<div><label>Warna</label><select id="iv"><option value="0">Normal</option><option value="1">Invert</option></select></div></div>
<div class="r" style="margin-top:8px"><label style="margin:0"><input type="checkbox" id="al" style="width:auto"> Auto-levels</label>
<label style="margin:0"><input type="checkbox" id="fh" style="width:auto"> Mirror H</label>
<label style="margin:0"><input type="checkbox" id="fv" style="width:auto"> Mirror V</label></div></div>

<div class="c"><h3>4 · Konversi &amp; upload</h3>
<div class="r"><div><label>Nama MV</label><input id="nm" value="mv1" maxlength="30"></div></div>
<label>Firebase URL</label><input id="db" value="https://hadiah-esp32-default-rtdb.asia-southeast1.firebasedatabase.app">
<div class="r"><button id="bc" onclick="conv()">🎞 Konversi</button><button id="bu" onclick="up()">☁ Upload</button></div>
<progress id="pg" value="0" max="100"></progress>
<div class="hint" id="stt">Frame: 0</div><div id="log"></div></div>

<div class="c"><h3>5 · Kontrol perangkat</h3>
<div><span class="dot" id="dot"></span><span id="ds">Menghubungkan...</span></div>
<div class="r" id="ib" style="margin-top:8px"></div>
<div class="sl"><label>Cahaya OLED</label><input type="range" id="oc" min="0" max="255" value="200" oninput="$('ocv').textContent=this.value" onchange="api('PATCH','/kontrol',{kecerahan:+this.value}).catch(er)"><b id="ocv">200</b></div>
<input id="pi" maxlength="80" placeholder="Ketik pesan untuk OLED (tanpa emoji)...">
<div class="r"><button onclick="kirim($('pi').value)">📨 Kirim</button><button onclick="kirim('')">🗑 Hapus</button></div>
<div class="r"><button onclick="kirim('Aku sayang kamu')">Sayang</button><button onclick="kirim('Kangen kamu')">Kangen</button><button onclick="kirim('I love you')">I love you</button></div></div>

<div class="c"><h3>6 · MV tersimpan</h3><div id="lib">Memuat...</div><button onclick="lib()" style="width:100%">🔄 Refresh</button></div>

<script>
const $=i=>document.getElementById(i);
const V=$('v');let frames=[],anim=null,ana=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function log(m){const e=$('log');e.textContent='['+new Date().toLocaleTimeString()+'] '+m+'\n'+e.textContent.slice(0,3000)}
const er=e=>log('❌ '+(e.message||e));
const DB=()=>$('db').value.replace(/\/+$/,'');
async function api(m,p,b,q){const r=await fetch(DB()+p+'.json'+(q||''),{method:m,body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw new Error(m+' '+p+' HTTP '+r.status);return r.json()}
async function retry(f){for(let i=0;i<3;i++){try{return await f()}catch(e){if(i==2)throw e;await sleep(800)}}}

const SL=[['zm','Zoom',100,300,100],['fx','Fokus X',0,100,50],['fy','Fokus Y',0,100,50],['br','Terang',-100,100,0],['co','Kontras',-100,100,0],['ga','Gamma',50,200,100],['sh','Tajam',0,3,0],['bl','Blur',0,2,0]];
$('sls').innerHTML=SL.map(s=>`<div class="sl"><label>${s[1]}</label><input type="range" id="${s[0]}" min="${s[2]}" max="${s[3]}" value="${s[4]}" oninput="$('${s[0]}v').textContent=this.value"><b id="${s[0]}v">${s[4]}</b></div>`).join('');
const IDL=[['idle0','😊 Wajah'],['idle1','😴 Tidur'],['idle2','💕 Hati'],['idle3','🌙 Bintang'],['idle4','🕒 Jam']];
$('ib').innerHTML=IDL.map(i=>`<button id="i_${i[0]}" onclick="setIdle('${i[0]}')">${i[1]}</button>`).join('');

$('vf').onchange=e=>{const f=e.target.files[0];if(!f)return;V.src=URL.createObjectURL(f);V.onloadedmetadata=()=>{$('vi').textContent='📹 '+V.videoWidth+'×'+V.videoHeight+' · '+V.duration.toFixed(1)+'s';$('du').value=Math.min(30,Math.floor(V.duration));ana=null;log('Video dimuat')}};

function seek(t){return new Promise((res,rej)=>{t=Math.max(0,Math.min(t,V.duration-.05));if(Math.abs(V.currentTime-t)<.001){res();return}
const to=setTimeout(()=>{V.onseeked=null;rej(new Error('seek timeout'))},8000);
V.onseeked=()=>{clearTimeout(to);V.onseeked=null;setTimeout(res,15)};V.currentTime=t})}

function grab(W,H){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true});
x.fillStyle='#000';x.fillRect(0,0,W,H);const vw=V.videoWidth,vh=V.videoHeight,m=$('cm').value;
if(m==='fit'){const s=Math.min(W/vw,H/vh);x.drawImage(V,0,0,vw,vh,(W-vw*s)/2,(H-vh*s)/2,vw*s,vh*s)}
else if(m==='stretch')x.drawImage(V,0,0,W,H);
else{const z=$('zm').value/100,ar=W/H;let sw,sh;if(vw/vh>ar){sh=vh/z;sw=sh*ar}else{sw=vw/z;sh=sw/ar}
x.drawImage(V,($('fx').value/100)*(vw-sw),($('fy').value/100)*(vh-sh),sw,sh,0,0,W,H)}
return x.getImageData(0,0,W,H)}

function blur(g,r){const W=128,H=64,t=new Float32Array(g.length),o=new Float32Array(g.length);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){let s=0,n=0;for(let k=-r;k<=r;k++){const xx=x+k;if(xx<0||xx>=W)continue;s+=g[y*W+xx];n++}t[y*W+x]=s/n}
for(let x=0;x<W;x++)for(let y=0;y<H;y++){let s=0,n=0;for(let k=-r;k<=r;k++){const yy=y+k;if(yy<0||yy>=H)continue;s+=t[yy*W+x];n++}o[y*W+x]=s/n}
return o}
const BY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];

function process(img){const d=img.data,n=8192;let g=new Float32Array(n),i,x,y;
for(i=0;i<n;i++)g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
if($('fh').checked||$('fv').checked){const c=Float32Array.from(g),h=$('fh').checked,v=$('fv').checked;
for(y=0;y<64;y++)for(x=0;x<128;x++)g[y*128+x]=c[(v?63-y:y)*128+(h?127-x:x)]}
let lo=0,hi=255;if($('al').checked&&ana){lo=ana.lo;hi=ana.hi}
const br=+$('br').value,co=+$('co').value,cf=(259*(co+255))/(255*(259-co)),ga=$('ga').value/100;
for(i=0;i<n;i++){let v=(g[i]-lo)*255/Math.max(1,hi-lo);v=cf*(v+br-128)+128;v=v<0?0:v>255?255:v;g[i]=255*Math.pow(v/255,1/ga)}
const bl=+$('bl').value;if(bl>0)g=blur(g,bl);
const sh=+$('sh').value;if(sh>0){const b2=blur(g,1);for(i=0;i<n;i++){const s=g[i]+sh*.6*(g[i]-b2[i]);g[i]=s<0?0:s>255?255:s}}
const thr=+$('th').value,md=$('dm').value,o=new Uint8Array(n);
if(md==='fs'){const e=Float32Array.from(g);for(y=0;y<64;y++)for(x=0;x<128;x++){i=y*128+x;const old=e[i],on=old>=thr?1:0,er2=old-(on?255:0);o[i]=on;
if(x<127)e[i+1]+=er2*7/16;if(y<63){if(x>0)e[i+127]+=er2*3/16;e[i+128]+=er2*5/16;if(x<127)e[i+129]+=er2/16}}}
else if(md==='bayer'){for(y=0;y<64;y++)for(x=0;x<128;x++){i=y*128+x;o[i]=g[i]>=BY[(y&3)*4+(x&3)]*16+8+(thr-128)?1:0}}
else for(i=0;i<n;i++)o[i]=g[i]>=thr?1:0;
if($('iv').value==='1')for(i=0;i<n;i++)o[i]^=1;
return o}
const frameAt=async t=>{await seek(t);return process(grab(128,64))};
function draw(bin,cv){const x=cv.getContext('2d'),im=x.createImageData(128,64);for(let i=0;i<8192;i++){const v=bin[i]?255:0;im.data[i*4]=im.data[i*4+1]=im.data[i*4+2]=v;im.data[i*4+3]=255}x.putImageData(im,0,0)}
function pack(bin){const b=new Uint8Array(1024);for(let p=0;p<8;p++)for(let x=0;x<128;x++){let by=0;for(let k=0;k<8;k++)if(bin[(p*8+k)*128+x])by|=1<<k;b[p*128+x]=by}return b}
function b64(a){let s='';for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s)}
function drawPacked(a,cv){const x=cv.getContext('2d'),im=x.createImageData(128,64);for(let p=0;p<8;p++)for(let c=0;c<128;c++){const b=a[p*128+c];for(let k=0;k<8;k++){const i=((p*8+k)*128+c)*4,v=(b>>k)&1?255:0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}}x.putImageData(im,0,0)}

async function prev(){if(!V.duration)return log('Pilih video dulu');clearInterval(anim);try{draw(await frameAt(+$('st').value),$('pv'))}catch(e){er(e)}}
function playAnim(){clearInterval(anim);if(!frames.length)return log('Konversi dulu');let i=0;anim=setInterval(()=>{draw(frames[i],$('pv'));i=(i+1)%frames.length},1000/+$('fps').value)}

async function analyze(){if(!V.duration)return log('Pilih video dulu');
const D=V.duration,step=Math.max(.5,D/300),N=Math.floor(D/step),W=64,H=32,S=[],hist=new Float64Array(256);let prevG=null;
$('ba').disabled=true;$('ai').textContent='Menganalisis '+N+' titik...';
for(let i=0;i<N;i++){try{await seek(i*step)}catch(e){}
const d=grab(W,H).data,g=new Float32Array(W*H);let m=0;
for(let k=0;k<g.length;k++){g[k]=.299*d[k*4]+.587*d[k*4+1]+.114*d[k*4+2];m+=g[k];hist[Math.min(255,g[k]|0)]++}
m/=g.length;let sd=0,ed=0,mo=0;
for(let k=0;k<g.length;k++){sd+=(g[k]-m)**2;if(k%W)ed+=Math.abs(g[k]-g[k-1]);if(prevG)mo+=Math.abs(g[k]-prevG[k])}
S.push({m,c:Math.sqrt(sd/g.length),e:ed/g.length,mo:mo/g.length});prevG=g;
if(i%10==0){$('pg').value=i/N*100;await sleep(0)}}
const mx=k=>Math.max(1e-6,...S.map(s=>s[k])),mC=mx('c'),mE=mx('e'),mM=mx('mo');
let sc=S.map(s=>{let v=s.c/mC*.25+s.e/mE*.35+s.mo/mM*.4;if(s.m<20||s.m>240)v*=.3;return v});
const top=Math.max(1e-6,...sc);sc=sc.map(v=>v/top);
const du=+$('du').value,L=Math.min(N,Math.max(1,Math.round(du/step)));let best=0,bs=-1,cur=0;
for(let i=0;i<N;i++){cur+=sc[i];if(i>=L)cur-=sc[i-L];if(i>=L-1&&cur>bs){bs=cur;best=i-L+1}}
let tot=0;for(let i=0;i<256;i++)tot+=hist[i];let lo=0,hi=255,cu=0;
for(let i=0;i<256;i++){cu+=hist[i];if(cu>=tot*.02){lo=i;break}}cu=0;
for(let i=0;i<256;i++){cu+=hist[i];if(cu>=tot*.98){hi=i;break}}
ana={sc,best,L,lo,hi};let s0=best*step;if(s0+du>D)s0=Math.max(0,D-du);
$('st').value=s0.toFixed(1);$('al').checked=hi-lo>20&&hi-lo<235;
drawTL();$('pg').value=0;$('ba').disabled=false;
$('ai').textContent='✅ Adegan terbaik mulai detik '+s0.toFixed(1)+' · auto-levels '+lo+'–'+hi+' (pink = klip terpilih)';prev()}
function drawTL(){const c=$('tl'),x=c.getContext('2d'),W=c.width,H=c.height;x.clearRect(0,0,W,H);if(!ana)return;
const n=ana.sc.length;x.fillStyle='rgba(255,77,141,.28)';x.fillRect(ana.best/n*W,0,ana.L/n*W,H);
x.fillStyle='#ff4d8d';for(let i=0;i<n;i++)x.fillRect(i/n*W,H-ana.sc[i]*H,Math.max(1,W/n-.5),ana.sc[i]*H)}

async function conv(){if(!V.duration)return log('Pilih video dulu');
const st=+$('st').value,du=+$('du').value,fp=+$('fps').value,n=Math.min(Math.floor(du*fp),3600);
if(n<1)return log('Frame 0');clearInterval(anim);$('bc').disabled=$('bu').disabled=true;frames=[];const t0=Date.now();log('Konversi '+n+' frame @ '+fp+' fps');
for(let i=0;i<n;i++){const t=st+i/fp;if(t>=V.duration)break;
try{frames.push(await frameAt(t))}catch(e){frames.push(frames.length?frames[frames.length-1]:new Uint8Array(8192))}
if(i%4==0||i==n-1){$('pg').value=(i+1)/n*100;await sleep(0)}
if(i%40==0)log('Frame '+(i+1)+'/'+n)}
$('stt').textContent='Frame: '+frames.length+' · ~'+(frames.length/1024).toFixed(1)+' MB · '+Math.ceil(frames.length/30)+' chunk';
log('✅ Selesai '+((Date.now()-t0)/1000).toFixed(0)+'s');$('bc').disabled=$('bu').disabled=false;playAnim()}

async function up(){if(!frames.length)return log('Konversi dulu');
const nm=$('nm').value.trim().replace(/[^\w-]/g,'_')||'mv1',fp=+$('fps').value,cs=30,tc=Math.ceil(frames.length/cs);
$('bu').disabled=true;
try{const B=frames.map(f=>b64(pack(f)));
await api('DELETE','/mv/'+nm);
for(let c=0;c<tc;c++){await retry(()=>api('PUT','/mv/'+nm+'/chunk'+String(c).padStart(3,'0'),B.slice(c*cs,(c+1)*cs).join('|')));$('pg').value=(c+1)/tc*100;log('Chunk '+(c+1)+'/'+tc)}
await api('PUT','/mv/'+nm+'/thumb',B[Math.min(2,B.length-1)]);
await api('PUT','/mv/'+nm+'/info',{nama:nm,fps:fp,totalFrame:frames.length,totalChunk:tc,chunkSize:cs,lebar:128,tinggi:64,durasiFrameMs:Math.round(1000/fp),dibuat:Date.now(),audioFile:'',audioExt:'',audioDuration:0});
log('✅ Upload selesai: '+nm);lib()}catch(e){er(e)}$('bu').disabled=false}

let K={},S2={};
const setIdle=m=>api('PATCH','/kontrol',{tampil:'idle',idle:m}).then(()=>{K.tampil='idle';K.idle=m;ui();log('Idle: '+m)}).catch(er);
const play=n=>api('PATCH','/kontrol',{tampil:'mv',aktif:n}).then(()=>{K.tampil='mv';K.aktif=n;ui();log('▶ '+n)}).catch(er);
const kirim=t=>{t=t.trim();api('PATCH','/kontrol',{pesan:t||null}).then(()=>log(t?'📨 '+t:'Pesan dihapus')).catch(er)};
async function del(n){if(!confirm('Hapus '+n+'?'))return;try{await api('DELETE','/mv/'+n);log('🗑 '+n);lib()}catch(e){er(e)}}

async function lib(){const el=$('lib');
try{const ks=Object.keys(await api('GET','/mv',undefined,'?shallow=true')||{}).filter(k=>/^[\w-]+$/.test(k));
if(!ks.length){el.textContent='Belum ada MV.';return}
const D=await Promise.all(ks.map(async k=>{const[i,t]=await Promise.all([api('GET','/mv/'+k+'/info').catch(()=>null),api('GET','/mv/'+k+'/thumb').catch(()=>null)]);return{k,i:i||{},t}}));
el.innerHTML=D.map(o=>{const tf=o.i.totalFrame||0,fp=o.i.fps||10;return`<div class="mv" data-n="${o.k}"><canvas width="128" height="64" id="t_${o.k}"></canvas><div><b>${o.k}</b><br>${tf} frame · ${fp} fps · ${(tf/fp).toFixed(1)}s</div><button onclick="play('${o.k}')">▶</button><button onclick="del('${o.k}')" style="background:#b23b3b">🗑</button></div>`}).join('');
D.forEach(o=>{if(typeof o.t!=='string')return;try{const b=atob(o.t),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);if(a.length===1024)drawPacked(a,$('t_'+o.k))}catch(e){}});ui()}
catch(e){el.textContent='Error: '+e.message}}

function ui(){IDL.forEach(i=>$('i_'+i[0]).classList.toggle('sel',K.tampil!=='mv'&&(K.idle||'idle0')===i[0]));
document.querySelectorAll('.mv').forEach(e=>e.classList.toggle('on',K.tampil==='mv'&&K.aktif===e.dataset.n))}
async function poll(){try{const[k,s]=await Promise.all([api('GET','/kontrol'),api('GET','/status')]);K=k||{};S2=s||{};
const on=S2.ts&&Date.now()-S2.ts<40000;$('dot').classList.toggle('ok',!!on);
$('ds').textContent=on?'ESP32 online · '+S2.ip+' · '+S2.rssi+' dBm'+(S2.mv?' · '+S2.mv:''):'ESP32 offline';ui()}
catch(e){$('dot').classList.remove('ok');$('ds').textContent='Firebase tidak terjangkau'}}
log('Siap. Pilih video.');lib();poll();setInterval(poll,2500);
</script></body></html>
